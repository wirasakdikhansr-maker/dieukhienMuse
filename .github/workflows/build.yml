name: Build VideoDL APK

on:
  push:
    branches: [videodl]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: videodl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Create signing key
        run: keytool -genkeypair -keystore app/release.keystore -alias videodl -keyalg RSA -keysize 2048 -validity 36500 -storepass videodl123 -keypass videodl123 -dname "CN=VideoDL"
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk VideoDL.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VideoDL-apk
          path: videodl/VideoDL.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "videodl-${{ github.run_number }}" VideoDL.apk \
            --target "${{ github.sha }}" \
            --title "VideoDL build ${{ github.run_number }}" \
            --notes "Tải VideoDL.apk về điện thoại Android và cài đặt."
